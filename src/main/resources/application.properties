spring.application.name=onShape

spring.datasource.url=jdbc:postgresql://localhost:5432/onshape
spring.datasource.username=onshape
spring.datasource.password=onshape

spring.flyway.enabled=true

# --- Lebensmittel-Datenpipeline (INFRA-03, KONZEPT.md §10.4/§11.1) ---
off.api-base-url=https://world.openfoodfacts.org
usda.api-base-url=https://api.nal.usda.gov/fdc/v1
usda.api-key=DEMO_KEY
# Pfad zu einem lokal abgelegten BLS-4.0-Export; leer = Import ist deaktiviert.
bls.import-file-path=
foodimport.dedup.fuzzy-threshold=0.6
# Bewusst deaktiviert, bis USDA-Key/BLS-Datei echt konfiguriert sind.
foodimport.nightly.enabled=false
foodimport.nightly.cron=0 0 3 * * *
