spring.application.name=onShape

spring.datasource.url=jdbc:postgresql://localhost:5432/onshape
spring.datasource.username=onshape
spring.datasource.password=onshape

spring.flyway.enabled=true

# --- Auth / Onboarding (INFRA-Folgeepic, KONZEPT.md §5.1) ---
# Nur ein Dev-Default. In Produktion MUSS ${JWT_SECRET} gesetzt sein (min. 32 Byte, zufaellig).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-32-bytes-min}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:43200}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.oauth2.redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:3000/de/auth/callback}

# Google/Apple-Login: erst aktiv, wenn client-id/-secret echt gesetzt sind (leer = Property
# fehlt effektiv, Spring Boot registriert dann keinen ClientRegistrationRepository-Bean und
# SecurityConfig laesst /oauth2/** deaktiviert). Apple braucht zusaetzlich einen dynamisch aus
# einem privaten Schluessel generierten JWT als "client secret" -- das ist hier bewusst noch
# NICHT umgesetzt, siehe docs/progress.md.
#spring.security.oauth2.client.registration.google.client-id=
#spring.security.oauth2.client.registration.google.client-secret=
#spring.security.oauth2.client.registration.google.scope=openid,email,profile

# --- Integrationen: CSV-Import (FR-153) -- Spring-Default (1MB) reicht fuer mehrjaehrige
# Trainingshistorien-Exports (Hevy/Strong) nicht aus. ---
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Lebensmittel-Datenpipeline (INFRA-03, KONZEPT.md §10.4/§11.1) ---
off.api-base-url=https://world.openfoodfacts.org
usda.api-base-url=https://api.nal.usda.gov/fdc/v1
usda.api-key=DEMO_KEY
# Pfad zu einem lokal abgelegten BLS-4.0-Export; leer = Import ist deaktiviert.
bls.import-file-path=
foodimport.dedup.fuzzy-threshold=0.6
# Bewusst deaktiviert, bis USDA-Key/BLS-Datei echt konfiguriert sind.
foodimport.nightly.enabled=false
foodimport.nightly.cron=0 0 3 * * *
